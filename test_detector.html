<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Detector测试</title>
</head>

<body>

<h3>背包识别测试</h3>

<input type="file" id="file">

<br><br>

<canvas id="canvas"></canvas>

<pre id="out"></pre>


<script src="js/detector.js"></script>
<script src="js/objectDetector.js"></script>


<script>

let file=document.getElementById("file");

let canvas=document.getElementById("canvas");

let out=document.getElementById("out");


let img=new Image();



file.onchange=function(e){

    console.log("1. 图片选择成功");


    let reader=new FileReader();



    reader.onload=function(){


        img.onload=function(){


            console.log("2. 图片加载完成");


            canvas.width=img.naturalWidth;
            canvas.height=img.naturalHeight;



            let ctx=
            canvas.getContext("2d");



            ctx.drawImage(
                img,
                0,
                0
            );



            console.log("3. 开始检测");



            let cellMap =
            Detector.splitCells(
                canvas
            );



            console.log(
                "4. 格子检测结果",
                cellMap
            );



            let objects =
            ObjectDetector.findObjects(
                cellMap
            );



            console.log(
                "5. 物品检测结果",
                JSON.stringify(
                objects,
                    null,
                    2
                )
            );



            out.textContent =
            "格子:\n\n"+
            JSON.stringify(
                cellMap,
                null,
                2
            )
            +
            "\n\n物品:\n\n"+
            JSON.stringify(
                objects,
                null,
                2
            );


        }



        img.src=
        reader.result;


    }



    reader.readAsDataURL(
        e.target.files[0]
    );


}


</script>


</body>
</html>
