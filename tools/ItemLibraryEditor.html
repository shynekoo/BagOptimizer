<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Item Library Editor v26</title>
<style>
body{background:#222;color:white;font-family:Arial}
canvas{max-width:100%;border:1px solid #666}
button{margin:5px;padding:8px}
textarea,pre{background:#111;color:white;width:95%;padding:10px}
textarea{height:220px}
#log{height:180px;overflow:auto}
</style>
</head>
<body>

<h3>物品库录入器 v26</h3>

<input id="file" type="file" accept="image/*"><br>物品名称：<input id="itemName" placeholder="例如：紫色火焰珠">
<button id="make">生成物品</button>
<button id="clearSelect">清空选中</button>
<button id="copy">复制JSON</button>
<button id="clearJson">清空JSON</button>

<h4>当前选择</h4>
<pre id="select"></pre>

<h4>物品库 JSON</h4>
<textarea id="json"></textarea>

<h4>日志</h4>
<pre id="log"></pre>

<h4>物品截图预览</h4>
<canvas id="preview"></canvas>

<h4>背包</h4>
<canvas id="canvas"></canvas>

<script>
const file=document.getElementById("file");
const canvas=document.getElementById("canvas");
const preview=document.getElementById("preview");
const ctx=canvas.getContext("2d");
const pctx=preview.getContext("2d");
const jsonBox=document.getElementById("json");
const log=document.getElementById("log");
const selectBox=document.getElementById("select");

let img=new Image();
let loaded=false;
let selected=[];
let library=[];
let logs=[];
let currentImageName="";

const R={x:95/1280,y:1375/2844,w:1090/1280,h:925/2844};

function addLog(s){
 logs.push(s);
 log.textContent=logs.join("\n");
 log.scrollTop=log.scrollHeight;
}

function update(){
 selectBox.textContent=JSON.stringify(selected);
 jsonBox.value=JSON.stringify(library,null,2);
}

file.onchange=e=>{
 let reader=new FileReader();
 reader.onload=ev=>{
  img.onload=()=>{
   canvas.width=img.width;
   canvas.height=img.height;
   loaded=true;
   selected=[];
   redraw();
   update();
   addLog("图片加载成功 "+img.width+"×"+img.height);
  };
  img.src=ev.target.result;
 };
 reader.readAsDataURL(e.target.files[0]);
};

function drawGrid(){
 let cw=canvas.width*R.w/7;
 let ch=canvas.height*R.h/6;
 ctx.strokeStyle="yellow";
 ctx.lineWidth=2;

 for(let i=0;i<=7;i++){
  ctx.beginPath();
  ctx.moveTo(canvas.width*R.x+i*cw,canvas.height*R.y);
  ctx.lineTo(canvas.width*R.x+i*cw,canvas.height*R.y+6*ch);
  ctx.stroke();
 }

 for(let i=0;i<=6;i++){
  ctx.beginPath();
  ctx.moveTo(canvas.width*R.x,canvas.height*R.y+i*ch);
  ctx.lineTo(canvas.width*R.x+7*cw,canvas.height*R.y+i*ch);
  ctx.stroke();
 }
}

function redraw(){
 if(!loaded)return;

 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0);
 drawGrid();

 let cw=canvas.width*R.w/7;
 let ch=canvas.height*R.h/6;

 ctx.strokeStyle="red";
 ctx.lineWidth=5;

 selected.forEach(([r,c])=>{
  ctx.strokeRect(
   canvas.width*R.x+c*cw,
   canvas.height*R.y+r*ch,
   cw,ch
  );
 });
}

canvas.onclick=e=>{
 if(!loaded)return;

 let rect=canvas.getBoundingClientRect();
 let x=(e.clientX-rect.left)*canvas.width/rect.width;
 let y=(e.clientY-rect.top)*canvas.height/rect.height;

 let cw=canvas.width*R.w/7;
 let ch=canvas.height*R.h/6;

 let c=Math.floor((x-canvas.width*R.x)/cw);
 let r=Math.floor((y-canvas.height*R.y)/ch);

 if(r>=0&&r<6&&c>=0&&c<7){

  let id=selected.findIndex(v=>v[0]==r&&v[1]==c);

  if(id>=0){
   selected.splice(id,1);
   addLog("取消 "+r+","+c);
  }else{
   selected.push([r,c]);
   addLog("选择 "+r+","+c);
  }

  update();
  redraw();
 }
};

function buildItem(){

 let minR=Math.min(...selected.map(x=>x[0]));
 let maxR=Math.max(...selected.map(x=>x[0]));
 let minC=Math.min(...selected.map(x=>x[1]));
 let maxC=Math.max(...selected.map(x=>x[1]));

 let shape=[],mask=[];

 for(let r=minR;r<=maxR;r++){
  let row="",m=[];
  for(let c=minC;c<=maxC;c++){
   let ok=selected.some(x=>x[0]==r&&x[1]==c);
   row+=ok?"1":"0";
   m.push(ok?1:0);
  }
  shape.push(row);
  mask.push(m);
 }

 let id="item"+String(library.length+1).padStart(3,"0");
 let name=document.getElementById("itemName").value.trim()||id;
 let fileName=name.replace(/[\\/:*?"<>|]/g,"_")+".png";

 let cw=canvas.width*R.w/7;
 let ch=canvas.height*R.h/6;

 let sx=canvas.width*R.x+minC*cw;
 let sy=canvas.height*R.y+minR*ch;
 let sw=(maxC-minC+1)*cw;
 let sh=(maxR-minR+1)*ch;

 preview.width=sw;
 preview.height=sh;
 pctx.drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh);

 return {
  id:id,
  name:name,
  shape:shape,
  mask:mask,
  image:"items/"+fileName
 };
}

document.getElementById("make").onclick=()=>{
 if(!selected.length){
  addLog("没有选择格子");
  return;
 }

 let item=buildItem();

 currentImageName=item.image.split("/").pop();
 library.push(item);
 update();

 addLog("生成并加入 "+item.name+" ("+item.id+")");
 addLog("JSON已更新，当前物品数量:"+library.length);

 selected=[];
 update();
 redraw();

};

document.getElementById("clearSelect").onclick=()=>{
 selected=[];
 update();
 redraw();
 addLog("已清空选中");
};

document.getElementById("copy").onclick=()=>{
 let t=document.createElement("textarea");
 t.value=jsonBox.value;
 document.body.appendChild(t);
 t.select();
 document.execCommand("copy");
 t.remove();
 addLog("JSON复制成功");
};

document.getElementById("clearJson").onclick=()=>{
 library=[];
 update();
 addLog("JSON已清空");
};








</script>
</body>
</html>
